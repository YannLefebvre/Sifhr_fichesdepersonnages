/* ══════════ Données de l'environnement ══════════ */
function lieuxOf(e){
  if(e&&e.lieux&&Object.keys(e.lieux).length) return e.lieux;
  if(e&&(e.tokens||e.scores)) return {lieu_principal:{nom:'Lieu principal',tokens:e.tokens,scores:e.scores,pneumato:e.pneumato,nineCount:e.nineCount,nineThreshold:e.nineThreshold}};
  return {};
}
const lieuActif=()=>ETAT.lieuActif||Object.keys(lieuxOf(ETAT))[0]||'';
const slotsOf=()=>({...((CARTE&&CARTE.slots)||{}),...(ETAT.slots||{})});
function toks(l){ // jetons normalisés {axe:[...]}
  const t={}; const src=l.tokens||{};
  for(const k in src){ t[AXE_ALIAS[k]||k]=src[k]; }
  return t;
}
function pneuOf(l){ const p=l.pneumato||{}; return {...p, direction:p.direction||p.occultation||{}, zonesRevealed:{...(p.zonesRevealed||{}),direction:(p.zonesRevealed||{}).direction??(p.zonesRevealed||{}).occultation}}; }
function bilan(l){
  const t=toks(l); let w=0,b=0,best=null,bestN=0;
  AXE_IDS.forEach(a=>{const arr=t[a]||[]; const nw=arr.filter(x=>x==='white').length, nb=arr.filter(x=>x==='black').length; w+=nw;b+=nb; const sc2=nb*2+nw; if(sc2>bestN){bestN=sc2;best=a;}});
  return {w,b,dom:best||'terre',tot:w+b};
}
function slotVisible(s){
  if(isGM) return !!(s.titre||s.texte);
  const ra=s.revele_a; if(!ra||ra==='aucun') return false;
  if(ra==='tous') return true; if(Array.isArray(ra)) return ra.includes(playerId); return false;
}
const revealed=(v)=>v==='tous'||(Array.isArray(v)&&v.includes(playerId));
function iconeOf(k,l){
  if(l.geo&&l.geo.icone) return l.geo.icone;
  const n=(l.nom||k).toLowerCase();
  if(/hamm/.test(n)) return '♨'; if(/b[iî]m[aâ]r/.test(n)) return '⚕'; if(/q[aâ]siy|mont|jabal/.test(n)) return '⛰';
  if(/sagesse|hikma|ḥikma|biblioth/.test(n)) return '📚'; if(/[sṣ][aâ]li|couvent|madrasa|mosqu/.test(n)) return '🕌';
  if(/gu[eé]|chastel|bataille/.test(n)) return '⚔'; if(/chayzar|shayzar|citadel|forter/.test(n)) return '🏰'; return '🏛';
}
function distKm(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

    }

    const vents=(l.geo.vents||[]);

      vents.forEach((v,i)=>{const a=AXES[AXE_ALIAS[v.axe]||v.axe]; if(!a) return; const cap=(v.cap||0)*Math.PI/180, n=(v.intensite||1)*2+1, len=r*0.9+(v.intensite||1)*25;

      const ly=y-r-8>20?y-r-8:y+r+16;
      const txt=iconeOf(k,l)+' '+(l.nom||k), hw=Math.min(150,txt.length*2.9+14);
      el('rect',{x:f1(x-hw),y:f1(ly-11),width:f1(hw*2),height:16,rx:8,fill:'rgba(10,7,3,.8)',stroke:k===act?'#e0b860':'#4a3820'},g);
      label(g,x,ly+1,txt,{size:8.5,font:'Cinzel,serif',fill:k===act?'#f0d080':'#d8c090'});
      if(nEvt[k]){ el('circle',{cx:f1(x+hw-2),cy:f1(ly-9),r:6.5,fill:'#1a4a6a',stroke:'#6aaccc'},g); label(g,x+hw-2,ly-6.5,String(nEvt[k]),{size:7,fill:'#e8f4ff'}); }
      if(k===act) el('circle',{cx:f1(x),cy:f1(y),r:f1(r),fill:'none',stroke:'#f0d080','stroke-width':2,class:'pulse'},g);
    } else {
      if(k===act) el('circle',{cx:f1(x),cy:f1(y),r:15,fill:'none',stroke:'#f0d080','stroke-width':2,class:'pulse'},g);
      el('circle',{class:'ring',cx:f1(x),cy:f1(y),r:9.5,fill:'#1a1208',stroke:k===act?'#f0d080':'#c8a060','stroke-width':1.8,filter:'url(#glow)'},g);
      el('text',{x:f1(x),y:f1(y+3.8),'text-anchor':'middle','font-size':10.5,fill:'#f0d8a0'},g,iconeOf(k,l));
      const lb=el('g',{class:'zoom-lbl','data-min':l.geo.parent?1.25:0},g);
      label(lb,x,y+21,l.nom||k,{size:8,fill:'#fff3d8',halo:true});
      if(nEvt[k]){ el('circle',{cx:f1(x+9),cy:f1(y-9),r:6,fill:'#1a4a6a',stroke:'#6aaccc'},g); label(g,x+9,y-6.6,String(nEvt[k]),{size:7,fill:'#e8f4ff'}); }
    }
    if(isGM&&(l.nineThreshold||0)>0&&(l.nineCount||0)>0){ label(g,x+(isParent?0:0),y+(isParent?r-6:31),`9 : ${l.nineCount}/${l.nineThreshold}`,{size:7,fill:(l.nineCount>=l.nineThreshold)?'#ff7050':'#c8a060',halo:true}); }
    g.addEventListener('click',ev=>{ev.stopPropagation();select(k,false);});
    g.addEventListener('mouseenter',e=>tip(e,l.nom||k,(nEvt[k]?nEvt[k]+' événement(s)':'')+(k===act?' · lieu actif':'')));
    g.addEventListener('mouseleave',untip);
  });

  // Lieux hors carte : flèches au bord
  const C={lat:(LAT0+LAT1)/2,lon:(LON0+LON1)/2};
  offMap.forEach(([k,l])=>{
    const kmx=(l.geo.lon-C.lon)*Math.cos(C.lat*Math.PI/180), kmy=(l.geo.lat-C.lat);
    const ang=Math.atan2(kmx,kmy); const dx=Math.sin(ang), dy=-Math.cos(ang);
    const cx=W/2, cy=H/2, m=34; const tx=dx>0?(W-m-cx)/dx:dx<0?(m-cx)/dx:1e9, ty=dy>0?(H-m-cy)/dy:dy<0?(m-cy)/dy:1e9; const t=Math.min(tx,ty);
    const x=cx+dx*t, y=cy+dy*t, km=Math.round(distKm(C,l.geo));
    const g=el('g',{class:'lieu'+(selected===k?' sel':''),transform:`translate(${f1(x)},${f1(y)})`},Ll);
    el('line',{x1:f1(-dx*26),y1:f1(-dy*26),x2:f1(dx*4),y2:f1(dy*4),stroke:k===act?'#f0d080':'#c8a060','stroke-width':2.2,'marker-end':'url(#arrE)'},g);
    el('circle',{class:'ring',cx:f1(-dx*34),cy:f1(-dy*34),r:9,fill:'#1a1208',stroke:k===act?'#f0d080':'#c8a060','stroke-width':1.6},g);
    el('text',{x:f1(-dx*34),y:f1(-dy*34+3.6),'text-anchor':'middle','font-size':10,fill:'#f0d8a0'},g,iconeOf(k,l));
    const lx=-dx*34+(dx>0.3?-14:dx<-0.3?14:0), ly=-dy*34+(dy>0.3?-14:dy<-0.3?22:22);
    label(g,lx,ly,`${l.nom||k} · ${km} km`,{size:8,fill:'#fff3d8',halo:true,anchor:dx>0.3?'end':dx<-0.3?'start':'middle'});
    if(nEvt[k]){ el('circle',{cx:f1(-dx*34+9),cy:f1(-dy*34-9),r:6,fill:'#1a4a6a',stroke:'#6aaccc'},g); label(g,-dx*34+9,-dy*34-6.6,String(nEvt[k]),{size:7,fill:'#e8f4ff'}); }
    g.addEventListener('click',ev=>{ev.stopPropagation();select(k,false);});
    g.addEventListener('mouseenter',e=>tip(e,l.nom||k,`Hors de la carte, à ${km} km`)); g.addEventListener('mouseleave',untip);
  });
  applyLayers(); updateZoomLabels();
}

/* ══════════ Panneau latéral ══════════ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderSide(){
  const b=document.getElementById('side-body');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===tab));
  if(tab==='calques') return renderLayers(b);
  if(tab==='legende') return renderLegend(b);
  if(selected&&lieuxOf(ETAT)[selected]) return renderDetail(b,selected);
  const lieux=lieuxOf(ETAT), act=lieuActif(), slots=slotsOf();
  const nEvt={}; Object.values(slots).forEach(s=>{ if(s&&s.lieu_key&&slotVisible(s)) nEvt[s.lieu_key]=(nEvt[s.lieu_key]||0)+1; });
  const E=Object.entries(lieux);
  if(!E.length){ b.innerHTML=`<p class="note">${ROW?'Cet environnement n\'a pas encore de lieux.':'Carte seule : connectez-vous pour afficher les lieux de l\'environnement.'}</p>`; return; }
  const grp={on:[],off:[],none:[]};
  E.forEach(([k,l])=>{ const g=l.geo&&l.geo.lat!=null?(inside(l.geo.lat,l.geo.lon)?'on':'off'):'none'; grp[g].push([k,l]); });
  const row=([k,l])=>`<div class="li${selected===k?' sel':''}" data-k="${esc(k)}"><span class="ic">${iconeOf(k,l)}</span><span class="nm">${esc(l.nom||k)}${l.geo&&l.geo.parent&&lieux[l.geo.parent]?`<small>dans ${esc(lieux[l.geo.parent].nom)}</small>`:''}</span>${k===act?'<span class="badge act">actif</span>':''}${nEvt[k]?`<span class="badge evt">${nEvt[k]}</span>`:''}</div>`;
  b.innerHTML=(grp.on.length?'<div class="grp">Sur la carte</div>'+grp.on.map(row).join(''):'')
    +(grp.off.length?'<div class="grp">Hors de la carte</div>'+grp.off.map(row).join(''):'')
    +(grp.none.length?'<div class="grp">Sans position</div>'+grp.none.map(row).join('')+'<p class="note">Ajoutez une position (latitude, longitude) à ces lieux dans le document de l\'environnement.</p>':'');
  b.querySelectorAll('.li').forEach(d=>d.onclick=()=>select(d.dataset.k,true));
}
function renderDetail(b,k){
  const lieux=lieuxOf(ETAT), l=lieux[k], act=lieuActif(), pz=pneuOf(l), zr=pz.zonesRevealed||{};
  const t=toks(l), sc=l.scores||{};
  let h=`<button class="back" id="bk">← Tous les lieux</button><div class="card"><h3>${iconeOf(k,l)} ${esc(l.nom||k)}</h3>`;
  if(l.geo&&l.geo.parent&&lieux[l.geo.parent]) h+=`<div class="meta">dans ${esc(lieux[l.geo.parent].nom)}</div>`;
  if(l.geo&&l.geo.lat!=null) h+=`<div class="meta">${l.geo.lat.toFixed(4)}° N · ${l.geo.lon.toFixed(4)}° E${inside(l.geo.lat,l.geo.lon)?'':' · hors de la carte, à '+Math.round(distKm({lat:(LAT0+LAT1)/2,lon:(LON0+LON1)/2},l.geo))+' km'}</div>`;
  h+=k===act?'<div style="margin-top:.35rem"><span class="badge act">lieu actif</span></div>':'';
  h+='</div>';
  if(isGM&&k!==act){ h+=`<button class="btn" id="b-act" ${IN_FRAME?'':'disabled'}>⇄ Faire de ce lieu le lieu actif</button>`;
    if(!IN_FRAME) h+='<p class="note">Ouvrez la carte depuis la fiche d\'environnement pour changer de lieu actif.</p>'; }
  // Octogone local
  if(isGM){
    h+='<div class="card"><div class="sec-t">Octogone du lieu</div><div class="axes">';
    AXE_IDS.forEach(a=>{const arr=t[a]||[]; const tk=arr.map(x=>x==='white'?'○':x==='black'?'●':'·').join('')||'···';
      h+=`<span class="a" style="color:${AXES[a].c}">${AXES[a].l}</span><span class="tk">${tk}</span><span class="vv">${AXES[a].v} ${sc[a+'_0']||0} · ${AXES[a].vi} ${sc[a+'_1']||0}</span>`;});
    h+=`</div>${l.nineThreshold?`<div class="note">Neuf recueillis : ${l.nineCount||0} / ${l.nineThreshold}</div>`:''}</div>`;
  }
  // Pneumatographie
  const bl=bilan(l); let pzH='';
  if(isGM||zr.valeurs) pzH+=`<div class="pz"><b>Valeurs</b>niveau ${pz.valeurs||0}${bl.tot?` · ${bl.tot} jeton(s) en jeu`:''}</div>`;
  if(isGM||zr.polarite) pzH+=`<div class="pz"><b>Polarité</b>niveau ${pz.polarite||0}${(isGM||zr.polarite)&&bl.tot?` · ${bl.w} vertueux, ${bl.b} dévoyé(s)`:''}</div>`;
  ['direction','dynamique'].forEach(z=>{ [1,2,3].forEach(n=>{ const s=(pz[z]||{})[n]; if(!s||!s.text) return; if(!isGM&&!(zr[z]&&s.active)) return;
    pzH+=`<div class="pz"${isGM&&!s.active?' style="opacity:.55"':''}><b>${z==='direction'?'Direction':'Dynamique'} ${['I','II','III'][n-1]}${isGM&&!s.active?' · non révélé':''}</b>${esc(s.text)}</div>`; }); });
  if(pzH) h+=`<div class="card"><div class="sec-t">Pneumatographie</div>${pzH}</div>`;
  // Événements
  const ev=Object.entries(slotsOf()).filter(([,s])=>s&&s.lieu_key===k&&slotVisible(s));
  if(ev.length){
    h+='<div class="card"><div class="sec-t">Événements</div>';
    ev.forEach(([key,s])=>{
      const vis=isGM||revealed(s.revele_a);
      let tx=''; [['rumeur','texte_rumeur','revele_rumeur'],['indice','texte_indice','revele_indice'],['fait établi','texte_fait','revele_fait']].forEach(([lb,f,r])=>{
        if(!s[f]) return; const ok=isGM||revealed(s[r]); if(!ok) return;
        tx+=`<div class="ex"><i>${lb}${isGM&&!revealed(s[r])?' (non révélé)':''} —</i> ${esc(s[f])}</div>`; });
      if(isGM&&s.texte) tx=`<div class="ex">${esc(s.texte)}</div>`+tx;
      h+=`<div class="evt${isGM&&!revealed(s.revele_a)?' hid':''}"><div class="et">${esc(s.titre||key)}${isGM&&!revealed(s.revele_a)?' · masqué aux joueurs':''}</div>${tx}</div>`;
    });
    h+='</div>';
  }
  b.innerHTML=h;
  b.querySelector('#bk').onclick=()=>{selected=null;drawDynamic();renderSide();};
  const ba=b.querySelector('#b-act');
  if(ba) ba.onclick=()=>{ window.parent.postMessage({type:'SIFHR_LIEU_ACTIF',fiche:FICHE_ID,lieu:k},'*'); ba.disabled=true; ba.textContent='Demande envoyée…'; };
}
function renderLayers(b){
  b.innerHTML='<div class="grp">Opacité des calques</div>'+LAYERS.filter(L=>!L.gm||isGM).map(L=>`<div class="lay"><label>${L.n}<span id="v-${L.id}">${L.v} %</span></label><input type="range" min="0" max="100" step="5" value="${L.v}" data-id="${L.id}"></div>`).join('')
    +'<p class="note">Les réglages sont propres à votre écran.</p>';
  b.querySelectorAll('input').forEach(i=>i.oninput=()=>{const L=LAYERS.find(x=>x.id===i.dataset.id);L.v=+i.value;document.getElementById('v-'+L.id).textContent=L.v+' %';applyLayers();saveLayers();});
}
function renderLegend(b){
  let h='<div class="grp">Pneuma locale</div>';
  h+='<p class="note" style="margin-bottom:.4rem">Le halo d\'un lieu prend la couleur de l\'humeur qui porte le plus de jetons ; son intensité suit le nombre de jetons. Un cercle doré : les jetons vertueux dominent. Un cercle violet en pointillé : les jetons dévoyés dominent.'+(isGM?'':' Vous ne voyez que ce que le meneur a révélé (valeurs, polarité, direction).')+'</p>';
  AXE_IDS.forEach(a=>h+=`<div class="leg"><i style="background:${AXES[a].c}"></i>${AXES[a].l}</div>`);
  h+='<div class="grp">Carte</div><div class="leg"><i style="background:#3a7ab0"></i>Baradâ et canaux</div><div class="leg"><i style="background:#2c3a18"></i>Vergers de la Ghûṭa</div><div class="leg"><i style="background:#3a2b14"></i>Pentes du Qâsiyûn</div><div class="leg"><i style="background:#a07a40"></i>Enceinte, portes (■)</div><div class="leg"><i style="background:#1a4a6a;border:1px solid #6aaccc"></i>Nombre d\'événements visibles</div>';
  if(isGM) h+='<div class="grp">Scénario (meneur)</div><div class="leg"><i style="background:#e05030"></i>Fissures</div><div class="leg"><i style="border:1px dashed #e07040"></i>Sol tiède · ↓ eaux qui baissent</div><div class="leg"><i style="border:1px dashed #c04020"></i>Zones de la secousse (niv. 2 et 3)</div>';
  b.innerHTML=h;
}
function applyLayers(){ LAYERS.forEach(L=>{const g=document.getElementById(L.id); if(g) g.setAttribute('opacity',(L.gm&&!isGM)?0:L.v/100);}); }
function saveLayers(){ try{localStorage.setItem('sifhr_carte_damas_calques',JSON.stringify(Object.fromEntries(LAYERS.map(L=>[L.id,L.v]))));}catch(e){} }
function loadLayers(){ try{const s=JSON.parse(localStorage.getItem('sifhr_carte_damas_calques')||'{}'); LAYERS.forEach(L=>{if(s[L.id]!=null) L.v=s[L.id];});}catch(e){} }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;renderSide();});

function select(k,center){
  selected=k; tab='lieux';
  const l=lieuxOf(ETAT)[k];
  if(center&&l&&l.geo&&inside(l.geo.lat,l.geo.lon)){ const [x,y]=P(l.geo.lat,l.geo.lon); const r=wrap.getBoundingClientRect(); px=r.width/2-x*sc; py=r.height/2-y*sc; applyT(); }
  drawDynamic(); renderSide();
}

/* ══════════ Zoom et déplacement ══════════ */
const wrap=document.getElementById('map-wrap');
let sc=1,px=0,py=0,pan=null,pinch=null;
function clampPan(){ const r=wrap.getBoundingClientRect(), mw=W*sc, mh=H*sc;
  px = mw<=r.width ? (r.width-mw)/2 : Math.min(0,Math.max(r.width-mw,px));
  py = mh<=r.height ? (r.height-mh)/2 : Math.min(0,Math.max(r.height-mh,py)); }
function applyT(){ clampPan(); svg.style.transform=`translate(${px}px,${py}px) scale(${sc})`; updateZoomLabels(); }
function updateZoomLabels(){ svg.querySelectorAll('.zoom-lbl').forEach(g=>{const m=+g.dataset.min||0; g.setAttribute('opacity',sc>=m?1:0);}); }
function resetView(){ const r=wrap.getBoundingClientRect(); sc=Math.min(r.width/W,r.height/H); px=(r.width-W*sc)/2; py=(r.height-H*sc)/2; applyT(); }
function zoomAt(f,cx,cy){ const r=wrap.getBoundingClientRect(); const ns=Math.max(0.3,Math.min(10,sc*f)); const mx=cx-r.left,my=cy-r.top; px=mx-(mx-px)*(ns/sc); py=my-(my-py)*(ns/sc); sc=ns; applyT(); }
function zoomBy(f){ const r=wrap.getBoundingClientRect(); zoomAt(f,r.left+r.width/2,r.top+r.height/2); }
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});
wrap.addEventListener('pointerdown',e=>{ if(e.target.closest('.lieu')) return; pan={x:e.clientX,y:e.clientY,px,py}; wrap.classList.add('grabbing'); });
window.addEventListener('pointermove',e=>{
  if(pan&&!pinch){ px=pan.px+e.clientX-pan.x; py=pan.py+e.clientY-pan.y; applyT(); }
  const r=wrap.getBoundingClientRect(), sx=(e.clientX-r.left-px)/sc, sy=(e.clientY-r.top-py)/sc, cd=document.getElementById('coord');
  if(sx>=0&&sx<=W&&sy>=0&&sy<=H&&e.clientX<r.right){ const lon=LON0+sx/W*(LON1-LON0), lat=LAT1-sy/H*(LAT1-LAT0); cd.textContent=lat.toFixed(4)+'° N · '+lon.toFixed(4)+'° E'; cd.style.opacity=1; } else cd.style.opacity=0;
  moveTip(e);
});
window.addEventListener('pointerup',()=>{pan=null;wrap.classList.remove('grabbing');});
wrap.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); } },{passive:true});
wrap.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); zoomAt(d/pinch,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2); pinch=d; } },{passive:true});
wrap.addEventListener('touchend',()=>{pinch=null;},{passive:true});
// clic droit : copie « lat, lon » (pratique pour remplir la position d'un lieu dans le document)
wrap.addEventListener('contextmenu',e=>{ e.preventDefault(); const r=wrap.getBoundingClientRect(), sx=(e.clientX-r.left-px)/sc, sy=(e.clientY-r.top-py)/sc;
  const t=`${(LAT1-sy/H*(LAT1-LAT0)).toFixed(4)}, ${(LON0+sx/W*(LON1-LON0)).toFixed(4)}`; try{navigator.clipboard.writeText(t);}catch(x){} setStatus('Position copiée : '+t); });
window.addEventListener('resize',resetView);

/* ── Infobulle ── */
const TT=document.getElementById('tt');
function tip(e,t,d){ TT.innerHTML=`<b>${esc(t)}</b>${d?esc(d):''}`; TT.style.display='block'; moveTip(e); }
function untip(){ TT.style.display='none'; }
function moveTip(e){ if(TT.style.display==='none') return; let x=e.clientX+14,y=e.clientY+14; if(x+TT.offsetWidth>innerWidth) x=e.clientX-TT.offsetWidth-14; if(y+TT.offsetHeight>innerHeight) y=e.clientY-TT.offsetHeight-14; TT.style.left=x+'px'; TT.style.top=y+'px'; }
let stT=null; function setStatus(t){ const s=document.getElementById('status'); s.textContent=t; clearTimeout(stT); stT=setTimeout(()=>s.textContent=authenticated?(isGM?'Meneur · lecture seule':'Joueur · lecture seule'):'Carte seule',2500); }

/* ══════════ Connexion et données ══════════ */
async function fetchRow(){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/fiches?id=eq.${encodeURIComponent(FICHE_ID)}&select=id,nom,etat,carte,mot_de_passe,mot_de_passe_mj`,{headers:HDR});
  const d=await r.json(); return d[0]||null;
}
function applyRow(row){
  ROW=row; ETAT=(row&&row.etat&&typeof row.etat==='object')?row.etat:{}; CARTE=(row&&row.carte&&typeof row.carte==='object')?row.carte:{};
  if(row&&row.nom) document.getElementById('env-nom').textContent=row.nom;
  if(selected&&!lieuxOf(ETAT)[selected]) selected=null;
  drawDynamic(); renderSide();
}
async function login(pw,gm,pid){
  const err=document.getElementById('login-err'); err.textContent='';
  if(!pw){err.textContent='Saisissez le mot de passe.';return;}
  try{
    const row=await fetchRow();
    if(!row){err.textContent='Environnement introuvable : « '+FICHE_ID+' »';return;}
    if(row[gm?'mot_de_passe_mj':'mot_de_passe']!==pw){err.textContent=gm?'Mot de passe meneur incorrect.':'Mot de passe incorrect.';return;}
    delete row.mot_de_passe; delete row.mot_de_passe_mj;
    authenticated=true; isGM=gm; playerId=gm?'__mj__':(pid||'joueur');
    document.getElementById('login').style.display='none';
    document.getElementById('role').textContent=gm?'meneur':'joueur';
    setStatus(gm?'Meneur · lecture seule':'Joueur · lecture seule');
    applyRow(row); startRealtime();
    if(IN_FRAME) window.parent.postMessage({type:'CARTE_READY',fiche:FICHE_ID,carte:'damas'},'*');
  }catch(e){ err.textContent='Erreur réseau.'; console.error(e); }
}
document.getElementById('login-fiche').textContent='« '+FICHE_ID+' »';
document.getElementById('b-player').onclick=()=>login(document.getElementById('pw').value.trim(),false,document.getElementById('pid').value.trim());
document.getElementById('b-gm').onclick=()=>login(document.getElementById('pw').value.trim(),true,'');
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('b-player').click();});
document.getElementById('b-seule').onclick=()=>{ document.getElementById('login').style.display='none'; document.getElementById('role').textContent='sans données'; setStatus('Carte seule'); drawDynamic(); renderSide(); };

function startRealtime(){
  const url=SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';
  let ws,hb;
  function connect(){
    try{ ws=new WebSocket(url); }catch(e){ return; }
    ws.onopen=()=>{ ws.send(JSON.stringify({topic:'realtime:public:fiches:id=eq.'+FICHE_ID,event:'phx_join',payload:{},ref:'cd1'})); hb=setInterval(()=>ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})),25000); };
    ws.onmessage=e=>{ try{ const m=JSON.parse(e.data); const rec=m.payload&&m.payload.record; if((m.event==='UPDATE'||m.event==='INSERT')&&rec&&rec.id===FICHE_ID){ delete rec.mot_de_passe; delete rec.mot_de_passe_mj; applyRow({...ROW,...rec}); } }catch(x){} };
    ws.onclose=()=>{ clearInterval(hb); setTimeout(connect,3000); };
    ws.onerror=()=>ws.close();
  }
  connect();
}
// Messages de la page parente (environnement.html)
window.addEventListener('message',e=>{
  if(!IN_FRAME||e.source!==window.parent) return;
  const m=e.data||{};
  if(m.type==='SIFHR_ETAT'&&m.etat&&authenticated){ applyRow({...ROW,etat:m.etat}); }
  if(m.type==='SIFHR_FOCUS'&&m.lieu){ select(m.lieu,true); }
});

/* ── Démarrage ── */
loadLayers(); drawBase(); resetView(); renderSide();
(function auto(){ const pw=params.get('pw'); if(pw) setTimeout(()=>login(pw,params.get('gm')==='1',params.get('pid')||params.get('player_fiche')||''),30); })();
</script>
